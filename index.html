<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jason Yung</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #111;
      background: #fff;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 40px;
    }

    header h1 {
      font-size: 2.2em;
      font-weight: 700;
      margin-bottom: 6px;
    }

    header .tagline {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #555;
      margin-bottom: 0;
      font-size: 1em;
    }

    header .tagline a {
      color: #555;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    header .tagline a:hover { opacity: 0.5; }

    /* ── Section cards ── */
    .sections {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 520px) {
      .sections { grid-template-columns: 1fr; }
    }

    .card {
      display: block;
      border: 1.5px solid #ddd;
      padding: 28px 24px;
      text-decoration: none;
      color: #111;
      transition: border-color 0.15s, background 0.15s;
    }

    .card:hover {
      border-color: #111;
      background: #f7f7f7;
    }

    .card .label {
      font-size: 0.75em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 8px;
    }

    .card h2 {
      font-size: 1.25em;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 0.9em;
      color: #555;
      line-height: 1.5;
    }

    /* ── Art section (below cards) ── */
    .art-section {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .art-section h3 {
      font-size: 0.75em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 20px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .image-grid img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      background: #eee;
    }

    @media (max-width: 520px) {
      .image-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
